<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blindfold Board Prototype</title>
  <style>
    :root {
      --page-bg: #1e1712;
      --light-square: #a6825c;
      --dark-square: #7f5332;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(255, 223, 186, 0.08), transparent 38%),
        linear-gradient(180deg, #2a1f18 0%, var(--page-bg) 100%);
      color: var(--text-main);
      font-family: Georgia, "Times New Roman", serif;
    }

    #board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      width: 90vmin;
      height: 90vmin;
    }

    .square {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      user-select: none;
      color: transparent;
      overflow: hidden;
    }

    .square.light {
      background: var(--light-square);
    }

    .square.dark {
      background: var(--dark-square);
    }

    .piece-svg {
      width: 78%;
      height: 78%;
      display: block;
      overflow: visible;
    }

    .piece-svg path {
      fill: currentColor;
    }

    #board::after {
      content: "hover board!";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.4rem, 3vw, 2.1rem);
      letter-spacing: 0.06em;
      color: rgba(244, 239, 231, 0.88);
      background: rgba(22, 17, 13, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
    }

    #board.board-unfocused::after {
      opacity: 1;
    }
  </style>
</head>
<body>
  <section id="board" aria-label="Chessboard"></section>
  <script src="./opentype.min.js"></script>
  <script src="./flubber.min.js"></script>
  <script src="./board.js"></script>
</body>
</html>
